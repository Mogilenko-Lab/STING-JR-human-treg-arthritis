# =============================================================================
# SCHEMA DEFINITIONS (for validation)
# =============================================================================

schemas:
  master_gsea_table:
    required_columns:
      - pathway_id
      - pathway_name
      - database
      - nes
      - pvalue
      - padj
      - set_size
      - core_enrichment
      - contrast
      - direction
  master_de_table:
    required_columns:
      - gene_symbol
      - logFC
      - P.Value
      - adj.P.Val
      - contrast
      - significant
      - direction
  # Cross-phase effect-size contract (_conventions.md §8). Phase 5 meta-analyses these;
  # NEVER pool across effect_metric, and padj (not fdr) is canonical.
  common_effectsizes:
    required_columns:
      - dataset
      - signature
      - cell_state
      - contrast
      - effect_metric      # pseudobulk_nes | pseudobulk_logfc | percell_auc_smd
      - evidence_tier      # primary_pseudobulk | secondary_percell
      - estimate
      - se
      - ci_low
      - ci_high
      - direction          # up | down | ns
      - pvalue
      - padj
      - n_donors
      - n_cells
      - signoff_state     # pending | signed_off; integration fails closed

# =============================================================================
# HUMAN-REVIEW DECISIONS (recorded at breakpoints so re-runs replay them)
# =============================================================================
# Each breakpoint notebook terminates in a recorded decision here. `status: PENDING`
# means the gate has not been answered yet; downstream stages that depend on a gate
# must not proceed past it until status flips.

decisions:
  effect_sizes:
    # Deliberately pending. Only the compartment owner may admit these rows to
    # cross-dataset panels after reviewing the regenerated 12-row artifact.
    signoff: pending       # pending | signed_off
  qc:
    status: APPROVED         # QC thresholds sound; libraries retain high yield; only GSM4859852 (near-empty) dropped
    drop_gsms:
      - "GSM4859852"         # SF CD4_Treg p5: near-empty library (median ~14 UMIs / 9 genes/cell);
                             #   a UMI+gene outlier. Documented + hard-excluded.
  treg_gate:
    status: APPROVED         # frozen Treg/Tcon/CD8 gate holds; markers match clusters; labels frozen
    basis: "sorting"         # sorting-primary, refined by FOXP3/IL2RA/CTLA4/IKZF2
    # --- POPULATION FRAMING (labels frozen; corroborated by lineage-marker expression) ---
    # Verbatim from docs/_internal/plans/2026-07-11-cross-species-poi-integration/DESIGN.md §6
    # (§6.2 wording), grounded in the mt-hi retention note
    # human_treg_arthritis/docs/_internal/reasoning/2026-07-11-mthi-treg-solidification.md.
    coarse_treg_includes_mthi: true
      # The mt-hi / effector-like Treg subset stays INSIDE the frozen coarse `Treg`
      # label. Coarse `Treg` is the single frozen statistical stratum for the go/no-go.
    mthi_effector_treg: "descriptive_substratum"
      # Shown/described on embeddings only; the DE/GSEA strata are elsewhere. It also fails
      # the donor floor (pseudobulk_min_donors=3) when split out, so it is never tested
      # as its own pseudobulk contrast.
    heat_hi_tcon: "embedding_narrative_only"
      # A population defined BY the WT_heat score stays out of every statistical stratum — testing
      # WT_heat within it is circular (selection on outcome). UMAP/narrative use only;
      # never enters pseudobulk, GSEA, or an effect-size row.
  go_no_go:
    status: GO               # mouse 39C Treg up-program enriched in JIA SF T cells; broad/pan-T, not Treg-preferential; continue
    primary_signature: "WT_heat"
