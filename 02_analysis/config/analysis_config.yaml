# analysis_config.yaml — language-agnostic project configuration
# Template version: 2.1.0
#
# This file holds ALL project-specific values that must NOT be hardcoded in
# analysis scripts. It is the cross-language data contract: both R and Python read it.
#
# Usage:
#   R:      config <- yaml::read_yaml("02_analysis/config/analysis_config.yaml")
#   Python: with open("02_analysis/config/analysis_config.yaml") as f: config = yaml.safe_load(f)

# =============================================================================
# PROJECT METADATA
# =============================================================================

project:
  id: "human_treg_arthritis"
  title: "Human Treg / arthritis T-cell compartment — sorted JIA SF Tregs + eTreg signatures (A2,B4)"
  species: "Homo sapiens"              # this compartment is human (known-issue #5 fix)
  species_db: "HS"        # drives MT/RP annotation + MSigDB species
  genome_build: "GRCh38"  # 10x CellRanger reference for GSE160097

# =============================================================================
# EXPERIMENTAL DESIGN
# =============================================================================

design:
  # GSE160097: FACS-sorted memory T-cell populations from synovial fluid (SF)
  # and peripheral blood (PB) of 7 JIA donors. Six donors span both arms within
  # each analyzed population. The contrast is blocked on donor and run
  # independently within each sorted population.
  tissue_key: "tissue"                 # obs column carrying SF / PB
  tissue_levels:
    synovial_fluid: "synovial_fluid"   # numerator (inflamed joint)
    peripheral_blood: "peripheral_blood"  # denominator (paired blood)
  donor_key: "donor"                   # blocking factor (paired design)
  population_key: "population"          # sorted identity: CD4_Treg / CD4_Tcon / CD8
  populations:
    - "CD4_Treg"                       # primary — the go/no-go compartment
    - "CD4_Tcon"                       # Treg-specificity control
    - "CD8"                            # Treg-specificity control
  contrasts:
    - name: "SF_vs_PB"
      numerator: "synovial_fluid"
      denominator: "peripheral_blood"
      model: "~ donor + tissue"        # donor-blocked model; six donors span both arms
  n_donors: 7

# =============================================================================
# ANALYSIS THRESHOLDS
# =============================================================================

thresholds:
  # --- scRNA QC (MAD-based adaptive, computed PER GSM; single-cell-rna-qc) ---
  qc_n_mads: 5                        # outlier = median +/- n_mads*MAD on log1p count/gene metrics
  qc_n_mads_mt: null                  # MAD multiplier for %mt SPECIFICALLY; null = ceiling-only
                                      #   (no per-GSM MAD on %mt) so thermally-stressed high-mito
                                      #   cells are retained — the mito gate is then just the ceiling.
  qc_pct_mt_max: 40.0                 # hard ceiling on mitochondrial % (stress-permissive)
  qc_min_genes: 200                   # hard floor: genes/cell
  qc_min_cells_per_gene: 3            # gene kept if detected in >= this many cells
  scrublet_expected_doublet_rate: 0.06

  # --- embedding (annotation/viz only) ---
  hvg_n_top: 3000
  n_pcs: 30
  leiden_resolution: 1.0

  # --- pseudobulk DE (donor x tissue x label; pseudobulk_utils) ---
  pseudobulk_min_cells: 20           # drop a donor x tissue x label stratum below this
  pseudobulk_min_donors: 3           # min donors per tissue arm to run a DE contrast
  de_fdr: 0.05                        # FDR cutoff for significance
  de_logfc: 1.0                       # absolute log2FC cutoff (optional)

  # GSEA
  gsea_fdr: 0.05                      # FDR cutoff for pathway significance
  gsea_nperm: 100000                  # number of permutations (fgsea uses eps/adaptive)
  gsea_seed: 123                      # random seed for reproducibility
  gsea_min_size: 5                    # min gene set size (WT_heat_down maps to 94 genes; small sets kept)
  gsea_max_size: 500                  # maximum gene set size

  # --- per-cell secondary scoring (AUCell/UCell; geneset_utils.score_cells_aucell_ucell) ---
  percell_score_ncores: 8             # parallel workers for AUCell rankings + UCell chunks

# =============================================================================
# COLOR PALETTES (colorblind-safe)
# =============================================================================

colors:
  # Okabe-Ito palette for categorical data
  okabe_ito:
    orange: "#E69F00"
    sky_blue: "#56B4E9"
    bluish_green: "#009E73"
    yellow: "#F0E442"
    blue: "#0072B2"
    vermillion: "#D55E00"
    reddish_purple: "#CC79A7"
    black: "#000000"

  # ==========================================================================
  # THE TWO CATEGORICAL AXES OF THIS COMPARTMENT, DECLARED TOGETHER.
  # ==========================================================================
  # Every figure that colours by sorted population or by tissue reads one of the two
  # blocks below. Values name a key of `okabe_ito` above, over a hex literal, so a
  # hue can never drift from the categorical palette. They are declared side by side on
  # purpose: the two axes must not share a hue, and that constraint is only visible if
  # both assignments are read in one place. Editing one of them means checking the other.
  #
  # THE PRIMARY CONSTRAINT IS THAT THE TWO AXES STAY DISJOINT. Several figures draw both,
  # and 10_umap_full_reference puts a tissue panel and a cell-state panel in the same row
  # of one figure, so a hue shared between the blocks would make the two axes
  # indistinguishable there. This is what fixes the assignments below: `populations` takes
  # bluish_green / orange / reddish_purple, `tissue` takes vermillion / blue, and the five
  # are distinct. It is also why populations may not take vermillion or blue.
  #
  # The assignment additionally matches what the collaborator bundle already draws
  # (integration/03_results/paper_figures/figures/): the frozen-cell-state panel of
  # 10_umap_full_reference, plus 14_arm_nes_by_cell_state and
  # 16_program_nes_by_cell_state, all carry Treg green, Tcon orange, CD8 pink, so
  # adopting it leaves those three figures uncut. That is a secondary convenience; the
  # disjointness constraint above would hold either way.

  # Read through `config.population_colors()` (Python) or `population_colors()` from the
  # figure-style shim (R). Both also resolve the long FACS spellings `CD4_Treg` /
  # `CD4_Tcon` to the same entries as `Treg` / `Tcon`.
  populations:
    Treg: bluish_green
    Tcon: orange
    CD8: reddish_purple

  # Read through `config.tissue_colors()` (Python) or `tissue_colors()` from the
  # figure-style shim (R). Keys must match `design.tissue_levels` above; both accessors
  # raise if they drift, so renaming a tissue level cannot silently orphan its colour.
  # Warm for the inflamed joint, cool for paired blood.
  tissue:
    synovial_fluid: vermillion
    peripheral_blood: blue

  # Diverging scale for NES, logFC (blue = down, orange = up)
  diverging:
    down: "#2166AC"
    neutral: "#F7F7F7"
    up: "#B35806"

  # Neutral dark grey for a REFERENCE annotation drawn on top of data: a fitted
  # expectation curve, a null band, a zero rule. Deliberately outside `okabe_ito` and
  # outside `diverging` so a reference line can never be mistaken for a data series in a
  # panel where every series already carries a categorical hue.
  reference_line: "#4D4D4D"

  # Group colors for sample comparisons
  groups:
    Control: "#56B4E9"
    Treatment: "#E69F00"

# =============================================================================
# FIGURES — the figure-style contract (read by figure_helpers.{R,py})
# =============================================================================
# Dual-context legibility: every figure must be readable BOTH shrunk in a
# journal column AND projected to the back of a conference room. The figure-
# style helper library reads this block. It is UNIFIED — ONE legible style tier
# (no print/screen split) emitted in BOTH formats: every figure is written as
# <name>.pdf (vector, cairo) AND <name>.png (raster) from one code path, same
# geometry, same theme. The font sizes below are FLOORS — raise, don't go under.

figures:
  # --- fonts (pt) — single tier (legible shrunk to a column AND projected) ---
  base_size: 14                       # base font (pt) FLOOR
  title_size: 16
  subtitle_size: 11
  axis_title_size: 13                 # plain (not bold)
  axis_text_size: 11
  strip_size: 12                      # facet strip labels (bold)
  legend_text_size: 11
  caption_size: 9
  label_size: 4                       # geom_text/geom_label size (ggplot mm)
  cue_size: 4                         # in-panel direction-cue text size
  line_width: 1.0                     # base line/segment width
  point_size: 2.4

  # --- geometry (inches) — ONE canvas shared by the pdf + png ----------------
  width: 8.5                          # default canvas
  height: 6.5
  width_wide: 13                      # two-column preset: save_figure(..., wide = TRUE)
  width_narrow: 6                     # single-column preset
  dpi: 300                            # raster dpi (png export)
  formats: [pdf, png]                 # both emitted for every figure

  # --- anti-clutter / comparability ----------------------------------------
  top_n: 20                           # cap categorical axes to top-N
  volcano_label_top: 10               # top genes to label
  z_clamp: 2.5                        # clamp z-scores for shared color scales
  nes_cap: 3.5                        # clamp NES for comparable bar lengths
  running_sum_ylim: [-1.0, 1.0]       # shared running-ES y-range (comparable curves)
  running_sum_top: 5                  # # of curves per running-sum panel (top-N by |NES|)
  running_sum_heights: [2.4, 0.7, 0.9] # ES : rug : metric panel-height proportions
  caption_wrap_column: 70             # README caption wrap width

  # --- results sub-layout directory names (results placement contract) ------
  by_contrast_dir: "by_contrast"      # 03_results/<stage>/figures/by_contrast/<c>/
  overview_dir: "_overview"           # 03_results/<stage>/figures/_overview/

# =============================================================================
# DATABASES TO ANALYZE
# =============================================================================

databases:
  msigdb:
    - { category: "H",  subcategory: "",            name: "Hallmark" }
    - { category: "C2", subcategory: "CP:KEGG",     name: "KEGG" }
    - { category: "C2", subcategory: "CP:REACTOME", name: "Reactome" }
    - { category: "C5", subcategory: "GO:BP",       name: "GO_BP" }
  custom: []
    # - { path: "00_data/references/custom_gene_sets.csv", name: "Custom" }

# =============================================================================
# CoReSh CO-REGULATION SEARCH (stage 15_coresh_search)
# =============================================================================
# Search the ~44k-dataset public HUMAN (hsa) GEO compendium for datasets in which
# the query genes co-vary, then turn the top hits into data-driven gene sets and
# score those on the same ranked list. Chunks are consumed READ-ONLY from the
# shared reference cache; the container never holds a Synapse token.
#
# Query construction MIRRORS the mouse anchor (mouse_anchor 07_coresh_search.R and
# its coresh.query_signatures block): the UP arm of the contrast at two stringency
# gates, fdr_only and fdr_logfc. Here the contrast is the JIA synovial-fluid-versus-
# paired-blood niche contrast and the gates are re-derived from the frozen
# limma-voom DE table that produced the ranked lists.

coresh:
  species: human                      # hsa chunks demand HUMAN Entrez ids
  chunks_subdir: "hsa"                # species subdir under CORESH_CHUNKS
  chunks_fallback: "00_data/references/coresh/current/preprocessed_chunks"
  top_n_hits: 5                       # top datasets per query -> derived sets
  hits_export_n: 200                  # rows per query written to coresh_hits.csv; the FULL
                                      #   ~265k-row ranking stays in the objects/ checkpoint
                                      #   (set to null to export the whole ranking)
  min_query_size: 3                   # coresh_batch asserts length(query) >= 3
  n_cores: 12                         # BiocParallel workers over chunk files
  pvalues: false                      # variance-only ranking (GESECA p-values are slow)
  n_derive: 50                        # genes per derived set BEFORE size filter
  jaccard: 0.8                        # drop a derived set >this Jaccard to an earlier one
  derived_min_size: 15                # derived-set size floor (skill guidance)
  derived_max_size: 500               # derived-set size ceiling
  n_annotation_terms: 15              # metadata terms carried per recovered dataset
  primary_population: treg            # the deliverable contrast
  # Query matrix: `population` selects the ranked list + DE table, `gate` the
  # stringency. direction is `up` for every entry, mirroring the mouse anchor.
  query_signatures:
    de_table: "03_results/03_pseudobulk/tables/de_SFvsPB_{population}.csv"
    ranked:   "03_results/03_pseudobulk/tables/ranked_{population}.tsv"
    sets:
      - { population: treg, direction: up, gate: fdr_only,  origin: "SF-vs-PB up, Treg" }
      - { population: treg, direction: up, gate: fdr_logfc, origin: "SF-vs-PB up, Treg" }
      - { population: tcon, direction: up, gate: fdr_only,  origin: "SF-vs-PB up, Tcon" }
      - { population: tcon, direction: up, gate: fdr_logfc, origin: "SF-vs-PB up, Tcon" }
      - { population: cd8,  direction: up, gate: fdr_only,  origin: "SF-vs-PB up, CD8" }
      - { population: cd8,  direction: up, gate: fdr_logfc, origin: "SF-vs-PB up, CD8" }

# =============================================================================
# SYMBOL-ALIAS RESOLUTION (asset built by 00_symbol_alias_map.R)
# =============================================================================
# GSE160097 was quantified against a CellRanger hg19 reference, so this compartment's
# count matrix is frozen to that build's HGNC vintage: cGAS is MB21D1, STING is
# TMEM173, MARCHF5 is MARCH5, MRE11 is MRE11A. Reference gene sets ship current symbols
# and every match here is an exact string match, so a renamed gene is dropped from a set
# silently and the loss reads as biological absence. TMEM173 sits at rank 265 and MB21D1
# at 458 of the 13,999-gene Treg synovial-vs-blood ranked list, and both are invisible
# to every STING gene set.
#
# The map is a property of (matrix vocabulary x org.Hs.eg.db release), independent of any one
# gene set, so it is computed once by 00_symbol_alias_map.R, committed, and read by both
# languages. Regenerating it is a deliberate act with a reviewable diff. Rebuild it when
# the matrix vocabulary changes, when org.Hs.eg.db moves, or when a collection is added
# to `unbiased_enrichment:` below.
#
# Resolution runs one way only: the reference symbol is NEWER and the matrix symbol is
# OLDER, so a reference symbol is resolved DOWN into the vocabulary the data carries.

symbol_alias:
  map_path: "00_data/references/symbol_alias/symbol_alias_map.csv"
  provenance_path: "00_data/references/symbol_alias/symbol_alias_provenance.csv"

  # The vocabulary the map resolves INTO, and the two nested layers above it that let a
  # ledger keep vocabulary loss apart from never-detected and from expression-filtered.
  # Conflating those three is the defect this asset exists for, so all three layers are
  # declared explicitly.
  matrix_vocabulary: "03_results/03_pseudobulk/tables/gene_symbols.csv"   # 21,740 post-QC symbols
  reference_feature_symbols: "03_results/00_build/tables/reference_feature_symbols.csv"  # 32,738 CellRanger features
  ranked_list: "03_results/03_pseudobulk/tables/ranked_{population}.tsv"  # post-filterByExpr

  # Pairs that pass the automated ownership guard but are NOT clean 1:1 nomenclature
  # updates. They are withheld from every tested set and appear in the map with
  # resolution `flagged_for_review`, so the exclusion is visible in the map.
  # MIR4435-2HG and MIR4435-1HG are two distinct lncRNA loci in most annotations: -1HG
  # was reclassified and org.Hs.eg.db carries it as an alias, but a lncRNA locus merge is
  # not the same class of event as a protein-coding rename, and this pair lands in
  # sting_specific_up, which is a claim surface.
  flagged_for_review:
    - "MIR4435-2HG->MIR4435-1HG"

  # Reference symbols the map must cover beyond the collections `unbiased_enrichment:`
  # declares. The projected mouse arms are read here for EVERY contrast and both
  # directions, because that stage sweeps the up arms only while stages 05, 09 and 13
  # consume the down arms and the interaction arms as well.
  extra_reference_dirs:
    - "../mouse_anchor/03_results/human_projection/signatures/"
    - "00_data/references/"

# =============================================================================
# UNBIASED ENRICHMENT SWEEP (stage 14_unbiased_enrichment)
# =============================================================================
# The unbiased counterpart to the targeted stage-05 test: every collection is
# scored against the same frozen SF-vs-PB ranked lists and no set is privileged.
# Declared as its own block, over widening `databases:` above, because
# `databases:` records the compartment's default four-collection choice that other
# stages may adopt, and this stage deliberately sweeps far wider.
#
# `msigdb` mirrors the mouse anchor's eight-collection sweep as closely as the human
# MSigDB release allows. In msigdbr 26.1.0 / MSigDB 2026.1.Hs the subcollection
# `CP:KEGG` was renamed `CP:KEGG_LEGACY`; the loader retries with the new name, so
# the configured value stays the mouse-anchor one. The mouse anchor's TF collection
# is MSigDB C3 TFT:GTRD; on the human side the repo already carries a curated
# CollecTRI regulon table, used instead (see `tf_network`) and tagged `TF_Targets`
# so the row stays comparable.
#
# Run parameters are NOT restated here: gsea_min_size / gsea_max_size / gsea_seed /
# gsea_nperm / gsea_fdr come from `thresholds:` above, which is the single source of
# truth this compartment's stage-05 run already used.

unbiased_enrichment:
  msigdb:
    - { category: "H",  subcategory: "",                name: "Hallmark" }
    - { category: "C2", subcategory: "CP:KEGG",         name: "KEGG" }
    - { category: "C2", subcategory: "CP:REACTOME",     name: "Reactome" }
    - { category: "C2", subcategory: "CP:WIKIPATHWAYS", name: "WikiPathways" }
    - { category: "C5", subcategory: "GO:BP",           name: "GO_BP" }
    - { category: "C5", subcategory: "GO:MF",           name: "GO_MF" }
    - { category: "C5", subcategory: "GO:CC",           name: "GO_CC" }

  # Non-MSigDB reference databases shipped pre-converted per species by the toolkit
  # under data/references/<db>/processed/<species>/, each run SEPARATELY with its own
  # GSEA call and its own `database` tag, mirroring the mouse anchor's `databases.custom`.
  #
  # TWO OF THE MOUSE ANCHOR'S CUSTOM DATABASES ARE DELIBERATELY ABSENT HERE, AND THE GAP
  # IS A DECISION RATHER THAN AN OVERSIGHT. The anchor's sweep carries TransportDB and
  # MitoXplorer; this one does not, and the anchor is not wrong to carry them — that
  # compartment is mouse and both databases have a genuine mouse build. This compartment
  # is human and neither has a human build, nor is one reconstructible from the bundled
  # raw files:
  #   - TransportDB ships one raw file of 1,290 MOUSE RefSeq protein accessions (NP_...).
  #     build_reference_databases.R will accept Homo_sapiens and substitute org.Hs.eg.db,
  #     which is a trap: none of those 1,290 accessions is a valid
  #     human REFSEQ key, so the conversion returns zero genes. A genuine human build
  #     needs the human TransportDB 2.0 export from membranetransport.org.
  #   - MitoXplorer ships native mouse MGI symbols only, and build_reference_databases.R
  #     skips Homo_sapiens explicitly ("mitoXplorer is mouse-only; no human data
  #     available"). A genuine human build needs the human table from the mitoXplorer site.
  # Ortholog-converting either mouse set is deliberately NOT done. Both are structural
  # annotation catalogues whose content IS the species-specific assignment, so a set
  # relabelled through an ortholog map is no longer the classification its name claims,
  # and this project names a set by how it was derived. If either is wanted later, the
  # honest form is a separate collection whose NAME says it is orthology-derived.
  custom_rds:
    # MitoPathways 3.0 from MitoCarta.
    #
    # THE DIRECTION OF DERIVATION RUNS OPPOSITE TO THE USUAL ONE IN THIS PROJECT, and that
    # is the more useful fact about this entry than its presence. The raw source
    # MitoPathways3.0.gmx is natively HUMAN; the mouse-anchor copy of this same database is
    # the homologene conversion of that file. So the human sweep reads the less derived
    # asset of the two, curated in human directly.
    #
    # 119 sets / 1,035 unique human symbols. The upstream catalogue holds 149 sets: the
    # toolkit's build applies a 5-gene floor when it writes the RDS, so 30 sets of 1 to 4
    # genes were already dropped before this compartment sees the file. That floor is the
    # same value as thresholds.gsea_min_size, so this stage's own filter removes nothing
    # further, and the 30 dropped sets are small nested leaves whose genes all survive in
    # their parents: the unique-symbol count is 1,035 both before and after the drop.
    - name: "MitoPathways"
      path: "01_modules/RNAseq-toolkit/data/references/mitocarta3.0/processed/Homo_sapiens/mito_mitopathways.rds"

  # CollecTRI regulons -> one UNSIGNED gene set per TF, tagged database TF_Targets.
  # Unsigned (activating and repressing targets pooled) so the set is the TF's
  # transcriptional neighbourhood, the way MSigDB TFT sets are built; the signed use
  # of the same network is decoupleR ULM, which is a different method and not this
  # stage's job.
  tf_network:
    path: "../mouse_anchor/00_data/references/networks/CollecTRI_regulons_human.csv"
    name: "TF_Targets"
    source_col: "source"
    target_col: "target"

  # This compartment's own frozen curated lists, already size-validated by their
  # reproducer scripts (freeze_hallmark_sets.R / freeze_hsr_lens.R).
  #
  # Six of these seven are re-pins of MSigDB Hallmark sets that the `Hallmark`
  # collection above also fetches, and they stay declared here because
  # freeze_hallmark_sets.R is what the decomposition and purge stages consume — a
  # manifest that stopped listing them would hide a real dependency. Their gene content
  # is identical to the live copies, so scoring both would put six exact duplicate
  # hypotheses into the pooled Benjamini-Hochberg family and inflate every population's
  # rank denominator by six. The stage resolves this itself: section 2b of
  # 14_unbiased_enrichment.R detects any set id present in more than one collection,
  # verifies the gene content matches, scores both copies (so each per-database table
  # still reads as a standalone single-collection run) and pools only the canonical one.
  # Canonicality follows the order collections are declared HERE, so `Hallmark` above
  # wins; the resolution is recorded per population in geneset_alias_map.csv. Nothing
  # needs tuning for this and no set name is hardcoded anywhere, so adding a seventh
  # frozen Hallmark set below is deduplicated by construction.
  project_frozen:
    name: "project_frozen"
    files:
      - "00_data/references/msigdb_hallmark/HALLMARK_HYPOXIA.txt"
      - "00_data/references/msigdb_hallmark/HALLMARK_UNFOLDED_PROTEIN_RESPONSE.txt"
      - "00_data/references/msigdb_hallmark/HALLMARK_TNFA_SIGNALING_VIA_NFKB.txt"
      - "00_data/references/msigdb_hallmark/HALLMARK_INTERFERON_ALPHA_RESPONSE.txt"
      - "00_data/references/msigdb_hallmark/HALLMARK_INFLAMMATORY_RESPONSE.txt"
      - "00_data/references/msigdb_hallmark/HALLMARK_IL2_STAT5_SIGNALING.txt"
      - "00_data/references/temp_hsr_lens/HSR_core.txt"

  # Mouse-derived projected arms, UP ARMS ONLY. Ordinary members of the sweep with no
  # privilege; the WT_heat_up row doubles as the reproduction gate against the
  # published stage-05 NES.
  mouse_projection:
    name: "mouse_projection"
    files:
      - "../mouse_anchor/03_results/human_projection/signatures/WT_heat/WT_heat_up.txt"
      - "../mouse_anchor/03_results/human_projection/signatures/KO_heat/KO_heat_up.txt"
      - "../mouse_anchor/03_results/human_projection/signatures/Interaction/Interaction_up.txt"

  # Frozen STING-versus-interferon axes from the SAVI positive-control compartment.
  sting_axes:
    name: "sting_axes"
    files:
      - "../sting_positive_control/03_results/06_reference_axis/signatures/sting_specific_up.txt"
      - "../sting_positive_control/03_results/06_reference_axis/signatures/ifn_only_up.txt"

  # Curated heat-shock-response lens, as its own collection so the sweep carries the same
  # named database the mouse anchor's sweep does. Two terms: HSR_core (56 human symbols,
  # the cleaned cytosolic subset) and HSR_sensitivity (176, the full union). Both are
  # frozen in this compartment by freeze_hsr_lens.R from the anchor's human lens under a
  # SHA pin, and the human list is the curated source: the lens
  # is built from three human MSigDB sets and the anchor's mouse list is the ortholog
  # derivative of it.
  #
  # DECLARED AFTER project_frozen ON PURPOSE. project_frozen already carries HSR_core as
  # its seventh file, so HSR_core is a set id present in two collections. Section 2b of
  # 14_unbiased_enrichment.R resolves that by declaration order, and declaring HSR_lens
  # last leaves HSR_core canonical under project_frozen exactly as before, so its pooled
  # adjusted p is unchanged by this collection existing. HSR_sensitivity is the one new
  # hypothesis this collection contributes to the pooled family.
  #
  # Honest ceiling, carried from the freeze provenance: even the clean core is
  # proteotoxic-stress-general, since HSF1 also fires on oxidative, proteasome and metal
  # stress. Only the mouse anchor's 37/39 contrast measures anything about temperature.
  hsr_lens:
    name: "HSR_lens"
    files:
      - "00_data/references/temp_hsr_lens/HSR_core.txt"
      - "00_data/references/temp_hsr_lens/HSR_sensitivity.txt"

  # Curated TCR/IEG T-cell activation lens, the activation-pole comparator the mouse
  # anchor's sweep also carries. 66 human symbols, frozen in this compartment by
  # freeze_tcr_activation_lens.R from the anchor's human asset under a SHA pin. The human
  # panel is the curated source; the anchor's mouse list is the ortholog conversion of it,
  # so nothing here is orthology-derived. FOXP3 is deliberately absent from the panel as a
  # lineage-identity marker, over an activation marker.
  tcr_activation:
    name: "TCR_activation"
    files:
      - "00_data/references/tcr_activation_lens/TCR_activation.txt"

  # This compartment's own effector-Treg contrast on GSE161426, UP ARM ONLY.
  #
  # Swept because the per-cell arm maps draw it, so the overview panels need a row for it.
  #
  # ANCHOR-INDEPENDENT AND DERIVED HERE, which its own `eTreg_lens` tag keeps visible
  # wherever `database` is reported: Welch t on the GSE161426 log2 matrix, SF against blood
  # effector Treg, n = 4 against 14, |log2FC| >= 1, p < 0.05, capped at 200 symbols.
  #
  # Declared last among the file-backed collections, so it adds one hypothesis per
  # population and moves no existing set's canonicality.
  etreg_lens:
    name: "eTreg_lens"
    files:
      - "00_data/references/etreg_GSE161426/eTreg_up.txt"

  # Pooled multiplicity correction is applied across the WHOLE family of tests
  # within one population, exactly as the mouse anchor's pooled pass does.
  padj_pooled_method: "BH"

  # Running-sum substrate emission. The mouse up arms are always emitted; this is how
  # many ADDITIONAL curated sets per population get a substrate table, chosen by
  # pooled p-value ascending then |NES| descending. The quota is split evenly between
  # the two directions: ranked on p-value alone every slot went to a paired-blood-side
  # translation or ribosome set, leaving the downstream running-sum comparison with no
  # synovial-fluid-side curated comparator for the up-going mouse arms.
  runsum_top_curated: 6

  # Curated sets that get a substrate table in EVERY population regardless of where they
  # rank. Without this the emission list is "the mouse arms plus whatever ranked top-6",
  # and a set the compartment's question turns on can have no curve at all: HALLMARK_HYPOXIA
  # sits outside the top 6 by pooled p in every population, so the co-imposed niche stress —
  # the one comparison a reader of the mouse-derived arm most wants — was the one curve that
  # could not be drawn. HSR_core is the anchor-independent proteostasis lens and is named
  # here for the same reason. Ids are matched against the CANONICAL collection each belongs
  # to after alias resolution, so naming a re-pinned set cannot produce two identical curves.
  # A named id that is not scorable in a population is reported and skipped, leaving no silent
  # dropped.
  # The cross-population running-sum family draws only sets with a curve in ALL THREE
  # populations, because a curve missing for one population there would read as "the set
  # does not enrich in that cell type" when it in fact means "that set did not rank into
  # that population's top-N quota, so no trace was written". Naming a set here is therefore
  # also what makes it eligible for that family, and every comparator the niche question
  # is read against is named explicitly, independent of any per-population ranking.
  runsum_always:
    - "HALLMARK_HYPOXIA"      # the co-imposed niche stress, not separable from temperature here
    - "HSR_core"              # the anchor-independent curated proteostasis lens
    - "sting_specific_up"     # SAVI-derived, STING-attributable content
    - "ifn_only_up"           # SAVI-derived, generic type-I interferon content

  # PROGENy (decoupleR MLM) — human model, mirroring the mouse anchor's top=500.
  progeny:
    organism: "Human"
    top: 500
    minsize: 5

  # The published stage-05 NES this stage must reproduce off the same ranked lists,
  # and the tolerance allowed for fgsea's stochastic normalisation.
  reproduction_check:
    signature: "WT_heat_up"
    source: "03_results/05_scoring/tables/gsea_pseudobulk_{tag}.csv"
    nes_tolerance: 0.01

# =============================================================================
# THE PER-CELL MAP PANELS — declared once, read by everything that draws or audits them
# =============================================================================
# The two six-panel score strips are drawn on the full object, on the Treg gate alone, and
# again as violins.
#
# This block ties them to the overview panels: 14_sweep_named_sets.R maps each entry to its
# sweep id and stops on a missing row.
# So adding a panel here pulls it into the overview figures too.
# Order is drawing order, left to right along a strip and then down.
percell_map_panels:
  # umap_full_arms / umap_treg_arms / arm_score_violins: three anchor-dependent mouse arms
  # ruled off from three lenses that know nothing of the mouse contrast.
  arm_strip:
    - "WT_heat_up"
    - "KO_heat_up"
    - "Interaction_up"
    - "HALLMARK_HYPOXIA"
    - "HSR_core"
    - "eTreg_up"

  # umap_full_programs / umap_treg_programs / program_score_violins: the cGAS-STING and
  # type-I interferon family, ruled off from the inflammation and activation programs a
  # shared colouring would be explained by.
  program_strip:
    - "sting_specific_published"
    - "ifn_generic_axis"
    - "HALLMARK_INTERFERON_ALPHA_RESPONSE"
    - "HALLMARK_TNFA_SIGNALING_VIA_NFKB"
    - "HALLMARK_INFLAMMATORY_RESPONSE"
    - "HALLMARK_IL2_STAT5_SIGNALING"

  # The two panels whose per-cell column name and swept set id differ: the substrate names
  # the SAVI axes for what they are on a map, the sweep carries the frozen file stems.
  # Spelled out, not guessed, so a lookup that finds no row is a real absence.
  sweep_id:
    sting_specific_published: "sting_specific_up"
    ifn_generic_axis: "ifn_only_up"

# =============================================================================
# TREG-SUBSET RE-EMBEDDING (stage 17_treg_reembedding)
# =============================================================================
# A second map of the same cells, computed on the sorted Treg gate alone, so Treg
# substructure is laid out without the other two sorted lineages taking up the
# variance. The recipe is the one the full-object embedding used (01_qc_filter.py):
# highly_variable_genes -> subset to HVGs -> scale(max_value=10) -> pca -> neighbors
# -> umap. `hvg_n_top` and `n_pcs` are deliberately NOT restated here; they are read
# from `thresholds:` above, which is the same source the full-object run read, so the
# two maps differ by which cells went in and by nothing else. `n_neighbors` is left at
# the scanpy default for the same reason (the full-object call did not set it).
#
# That recipe carries no batch correction, and on this single-lineage 27k subset it
# resolves donor-by-tissue sample of origin: 66.1% of a cell's 30 nearest neighbours
# share its donor against 14.6% expected, up from 42.0% on the full-object map. So the
# stage runs the recipe TWICE on the same cells and same PCA — once uncorrected and once
# with Harmony over `donor` applied to the PCA before neighbours and UMAP — and carries
# both coordinate pairs in one parquet so they are comparable cell for cell. Harmony is
# sanctioned for annotation/visualisation by the umbrella guardrail and claims nothing.
# Neighbourhood composition for `donor` and for `tissue` is measured on all three maps
# and published as a table, so the reader has the number before the map.
#
# Harmony runs at its standard settings (harmonypy defaults, restated here so they are
# visible in the record). They are set from the design and left there, over being tuned toward an acceptable
# mixing number.

treg_reembedding:
  subset_key: "coarse_label"          # frozen label column the subset is taken on
  subset_value: "Treg"                # FACS sort gate kept (a sort gate, never a score)
  expected_n_cells: 27175             # reproduction check on the subset size; reported, not reconciled
  random_seed: 0                      # random_state for pca / harmony / neighbors / umap
  source_parquet: "16_narrative_embedding.parquet"   # per-cell scores joined in on barcode
  output_parquet: "17_treg_reembedding.parquet"      # the widget substrate this stage writes
  checkpoint: "17_treg_reembedding.parquet"          # objects/ coordinate cache (barcode + reps + coords)
  reference_embedding_key: "X_umap_unsupervised"     # full-object map, restricted to the same cells
  mixing_k: 30                        # k nearest neighbours for the composition statistic
  mixing_keys:                        # obs factors whose neighbourhood composition is measured
    - "donor"
    - "tissue"

  # --- batch correction for the second variant (annotation/visualisation only) ---
  harmony_batch_key: "donor"          # the factor Harmony corrects over
  harmony_basis: "X_pca"              # the uncorrected PCA representation Harmony adjusts
  harmony_adjusted_basis: "X_pca_harmony"   # obsm key the corrected representation lands in
  harmony_max_iter: 10                # max_iter_harmony; the harmonypy default, stated not tuned

# =============================================================================
# ANALYSIS STAGES
# =============================================================================
# Each stage owns 03_results/<id>/{tables,figures}/, created on first write.
# Stage id = NN_<slug>: zero-padded two-digit prefix + lowercase snake_case (<=2 words).
# Append a new entry here BEFORE any script writes artifacts to that stage.

stages:
  - id: "00_build"
    title: "Ingest & assemble"
    purpose: "Per-GSM 10x H5 -> gene-union AnnData with donor/tissue/population provenance + raw counts layer."
  - id: "01_qc"
    title: "Quality control"
    purpose: "MAD adaptive QC per GSM, doublet flagging, first unsupervised embedding (usability review only)."
  - id: "02_annotation"
    title: "Sort-identity & frozen labels"
    purpose: "Confirm sorted Treg/Tcon/CD8 identity by markers on the unsupervised embedding; freeze coarse labels (sorting-primary). scANVI sub-states deferred until go = yes."
  - id: "03_pseudobulk"
    title: "Donor pseudobulk DE"
    purpose: "Aggregate raw counts to donor x tissue x label; SF-vs-PB DE per population; sign-preserving ranked lists."
  - id: "05_scoring"
    title: "Signature scoring"
    purpose: "Pre-ranked fgsea of the mouse WT_heat signature on pseudobulk ranked lists + per-cell scores. The go/no-go readout."
  - id: "07_embedding"
    title: "Treg embedding atlas (harvest-design preview)"
    purpose: "SUPPLEMENTARY/VISUALISATION only (embeddings are never the statistical readout). Previews the multi-hook bounded-OR harvest design (DESIGN §2.3): where each candidate signature lands on the UMAP alone and under the OR-union of anchor-orthogonal hooks (lineage OR effector OR mt-hi-viable). The mouse WT_heat anchor score is an annotation overlay, never a selection gate; no cells are lassoed/subset here."
  - id: "08_harvest_readout"
    title: "Hallmark hypoxia/UPR per-cell readouts (harvest)"
    purpose: "SECONDARY/annotation tier only (never pooled with the pseudobulk NES spine or the 07 POI harvest). Per-cell AUCell+UCell of MSigDB Hallmark HYPOXIA and UNFOLDED_PROTEIN_RESPONSE on the frozen annotation, aligned with the sting compartment, carried alongside the already-derived score_HSP/score_eTreg/WT_heat_updown readouts. Hypoxia is a READOUT (consistent-with a low-O2/stressed state), NOT a HIF-causality claim; feeds the reactive review and the cross-species harvest question."
  - id: "09_heat_hypoxia"
    title: "Heat versus hypoxia readout"
    purpose: "Correlative, tier-aware check of whether the JIA SF-vs-PB WT_heat enrichment survives removing HALLMARK_HYPOXIA-overlapping genes in the primary donor-pseudobulk tier, with secondary per-cell heat-hypoxia co-localization and exploratory leading-edge composition readouts kept separate from the pseudobulk NES."
  - id: "10_hsr_lens"
    title: "Curated heat-shock-response second lens"
    purpose: "ANNOTATION/secondary tier only (firewalled from the confirmatory WT_heat pseudobulk claim). Carries the curated, activation-free HSR proteostasis lens (HSR_core 56 / HSR_sensitivity 176, frozen from the mouse anchor's human-ortholog union) alongside the empirical WT_heat_up: per-cell AUCell+UCell of HSR on the frozen annotation, SF-vs-PB fgsea NES of HSR on the donor-pseudobulk ranked lists, within-SF per-cell WT_heat_up-vs-HSR 'same cells?' correlation, and the WT_heat_up-vs-HSR gene overlap. Asks how much of the JIA WT_heat separation is genuine thermal proteostasis versus activation; the HSR core is proteotoxic-stress-general, not fever-specific, so language stays correlative."
  - id: "11_heat_decomposition"
    title: "Mouse heat-signature decomposition"
    purpose: "SECONDARY/annotation tier only, firewalled from the confirmatory WT_heat pseudobulk claim (no row is written to effect_sizes_treg_arthritis.csv). Partitions the FULL mouse WT_heat up (199) and down (94) arms by intersection with curated, versioned, anchor-independent gene sets — the frozen HSR_core plus five frozen MSigDB Hallmark programs (UPR, HYPOXIA, TNFA_SIGNALING_VIA_NFKB, INTERFERON_ALPHA_RESPONSE, INFLAMMATORY_RESPONSE, IL2_STAT5_SIGNALING) — and asks where each subcomponent sits in each sorted population's SF-vs-PB donor-pseudobulk ranked list. The subset of the signature that no curated set claims is reported as its own 'unassigned' arm rather than hidden; a subcomponent whose testable size falls below gsea_min_size is reported as untestable WITH its size rather than dropped. The published de Cevins IFN-independent STING signature is carried as a gene-overlap tally only, never as a GSEA arm. Deliberately NOT decomposed by the WT_heat leading-edge taxonomy, which annotates only genes selected because they already enriched."
  - id: "12_treg_localisation"
    title: "Treg-only niche localisation"
    purpose: "Exploratory and corroborative per-cell score distributions for sorted JIA CD4_Treg cells (99,915-cell substrate subsetted by sort gate coarse_label == 'Treg'). Compares per-cell AUCell score distributions across synovial fluid versus peripheral blood for five signatures: WT_heat_up, Interaction_up (7 genes), Interaction_fdrOnly_up (18 genes), HALLMARK_HYPOXIA, and WT_heat_up_purged_hypoxia. Evaluates set sizes, power bands, and gate dependence, citing donor-pseudobulk DE as the confirmatory tier."
  - id: "13_arm_decomposition"
    title: "Curated-lens membership of the mouse-derived up arms"
    purpose: "SECONDARY/annotation tier only, firewalled from the confirmatory donor-pseudobulk claim spine (no row reaches effect_sizes_treg_arthritis.csv or any 03_results/master/ accumulator). Answers a MEMBERSHIP question and nothing else: which curated, versioned, anchor-independent programs CONTAIN the genes of each mouse-derived UP arm in human projection space — WT_heat_up (199 genes, gate fdr_logfc), KO_heat_up (218, fdr_logfc), Interaction_up (7, fdr_logfc) and Interaction_up_fdrOnly (18, the relaxed fdr_only gate, file Interaction_fdrOnly_up.txt) — against a nine-lens panel: the six frozen MSigDB Hallmark programs (HYPOXIA, TNFA_SIGNALING_VIA_NFKB, INFLAMMATORY_RESPONSE, IL2_STAT5_SIGNALING, INTERFERON_ALPHA_RESPONSE, UNFOLDED_PROTEIN_RESPONSE), the frozen curated HSR_core, the 21 published de Cevins IFN-independent STING-activation genes, and the 200-gene generic type-I interferon axis. Membership is not enrichment — containment is arithmetic over committed gene lists and carries no NES, no p-value and no effect size. Down arms are out of scope by design. Programs overlap and the arms are linearly dependent (WT_heat = KO_heat + Interaction by construction), so the emitted bands are not a partition of genes: per-gene multiplicity and fractional weights (1/n_programs_for_gene) are published so a downstream display can choose duplicated or fractional accounting without recomputing, and the genes no lens claims are reported as a first-class 'unassigned' remainder."
  - id: "14_unbiased_enrichment"
    title: "Unbiased multi-database enrichment and pathway activity"
    purpose: "The unbiased counterpart to the targeted stage-05 test, on the same frozen donor-pseudobulk SF-vs-PB ranked lists (limma-voom moderated t, HGNC symbol) and the same run parameters. Instead of asking whether one named signature enriches, it asks what the synovial-fluid-versus-paired-blood contrast contains at all: pre-ranked fgsea of every set in seven human MSigDB collections (Hallmark, KEGG, Reactome, WikiPathways, GO_BP, GO_MF, GO_CC), CollecTRI TF regulons, the toolkit's human MitoPathways build, this compartment's frozen curated lists (the frozen Hallmark re-pins, the curated heat-shock-response lens and the curated TCR activation lens), the mouse-derived projected UP arms and the frozen SAVI STING-versus-interferon axes, per sorted population, with no set privileged and Benjamini-Hochberg pooled across the whole family of tests within a population so a headline is read against how many hypotheses were asked. Complemented by decoupleR MLM on the human PROGENy model, run both on the moderated-t contrast statistics and on the donor-level pseudobulk, which scores fourteen signalling footprints without any gene-set list. Its purpose is calibration: it says whether the mouse-derived enrichment is a distinctive feature of this niche contrast or one of many co-enriching programs. Reproduction gate: WT_heat_up must land on the published stage-05 NES off the same ranked lists, or the sweep is on a different footing and nothing in it is comparable."
  - id: "15_coresh_search"
    title: "Co-regulation search of the public human compendium"
    purpose: "EXPLORATORY/hypothesis-generating tier only, firewalled from the confirmatory donor-pseudobulk claim spine (no row reaches effect_sizes_treg_arthritis.csv or any 03_results/master/ accumulator). Asks the human counterpart of the mouse anchor's co-regulation question: across ~44k public human GEO datasets, in which ones do the genes that go up in the JIA synovial niche co-vary? The query is the UP arm of the frozen limma-voom SF-vs-PB contrast at two stringency gates (fdr_only, fdr_logfc) per sorted population, mapped from HGNC symbol to human Entrez id because the compendium is Entrez-keyed; the mapping loss is published as a first-class number. The top-ranked public datasets are then projected back into gene-level loadings to give data-driven co-regulation modules, which are scored by pre-ranked fgsea on the same ranked list they were seeded from. A module is a co-regulation neighbourhood mined from public variance structure, NOT a curated ontology term, and a module seeded from a query necessarily contains that query's genes, so its enrichment on the seeding ranked list is partly circular by construction and is read as a description of what public biology the niche signature co-moves with, never as independent evidence."
  - id: "16_narrative_scoring"
    title: "One per-cell AUCell substrate for the narrative embedding"
    purpose: "SECONDARY/annotation tier only, never pooled with the donor-pseudobulk NES spine and writing no effect-size row. Scores the frozen 99,915-cell annotation once, with a single metric (AUCell), for fourteen sets in three kinds the manifest keeps apart: the four mouse-derived human-projected UP arms (WT_heat_up 177, KO_heat_up 195, Interaction_up 7, Interaction_fdrOnly_up 19 symbols scored in this object), nine curated anchor-independent program lenses (six frozen MSigDB Hallmark sets, the frozen HSR_core proteostasis lens, the 21 published de Cevins IFN-independent STING genes, and the 200-gene generic type-I interferon axis), and one project-derived anchor-independent lens (eTreg_up, this compartment's own GSE161426 SF-vs-PB Treg contrast, 173 scored, carrying kind=project_derived_lens because it is anchor-independent while falling short of curated or versioned). Joins them onto the published embedding coordinates so one substrate can colour the same map by an empirical arm and by a curated lens side by side. The published coordinates carry NO batch correction, and the donor structure that leaves is reported from stage 17's mixing table (0.420 same-donor neighbours at k=30 against 0.146 expected, on the Treg cells of this map) rather than left implicit. Down arms are deliberately out of scope. A provenance seam check re-derives the AUCell columns that already exist in the published per-cell readout and reports their correlation, so a reader can see whether this substrate sits on the same scale as the published one before trusting a colouring."
  - id: "17_treg_reembedding"
    title: "Treg-subset re-embedding of the same cells"
    purpose: "ANNOTATION/visualisation tier only, never pooled with the donor-pseudobulk NES spine and writing no effect-size row. Recomputes the embedding recipe of 01_qc_filter.py (highly_variable_genes -> subset to HVGs -> scale(max_value=10) -> pca -> neighbors -> umap, hvg_n_top and n_pcs read from the same thresholds block the full-object run read, random_state fixed) on the sorted Treg gate alone (coarse_label == 'Treg', 27,175 of 99,915 cells), so Treg substructure is laid out without the Tcon and CD8 gates taking up the variance. Because that recipe applies no batch correction and on this subset it resolves donor-by-tissue sample of origin, the stage emits TWO coordinate pairs off the same PCA: the uncorrected map, and a second map with Harmony over donor applied to the PCA before neighbours and UMAP, at harmonypy standard settings. Harmony here is a visualisation aid under the umbrella embeddings guardrail and supports no claim. Per-cell scores are NOT recomputed: every score column of 16_narrative_embedding.parquet is joined in on barcode, with the join asserted complete, so all maps can be coloured by identical values. Neighbourhood composition for donor and for tissue at k nearest neighbours is measured on the uncorrected Treg-only map, the Harmony-corrected Treg-only map and the full-object map restricted to the same cells, against the composition expected from the group proportions, and published as one table so the reader has the number before the map. Whether the corrected map is usable is decided from that table, and a negative is a valid outcome."
  - id: "18_tf_activity"
    title: "Inferred TF activity on the donor-paired niche contrast"
    purpose: "ANNOTATION tier only, never pooled with the donor-pseudobulk claim spine and writing no effect-size row. decoupleR on the frozen limma-voom SF-vs-PB moderated-t vectors for the three sorted populations, using the human CollecTRI network read across the compartment boundary under a SHA-256 pin. An inferred TF activity is a statistic over the expression of the genes a network assigns to a transcription factor, so this stage measures target-gene behaviour rather than transcription-factor protein activity. Four forensics answer whether a high-ranking regulon is a regulatory signal or a property of which genes sit in it: a rank cascade over four network variants (signed as recorded, unsigned, literature-signed edges only, alias-recovered) crossed with three estimators (ULM primary, MLM and consensus as forensics) plus the committed unsigned-regulon fgsea rank; per-target decomposition of the score against how many other CollecTRI regulons contain each target; calibration of activity against regulon size across every TF tested, with size-matched and size-plus-expression-matched random-regulon nulls and a size-conditional residual taken over the real regulons; and a direction audit that reports whether the recorded per-edge signs change the answer and names the canonical HIF1A-selective targets with their direction in this contrast. A symbol-vocabulary check is run first and published: the JIA count matrix carries pre-2019 HGNC symbols while CollecTRI carries current ones, so every network target that fails to match is reported with its cause (absent from the matrix, dropped by the expression filter, or recoverable through an alias) rather than dropped in silence."
  - id: "19_regulon_nulls"
    title: "Degree-preserving and sign-flip nulls for the inferred regulon activity"
    purpose: "ANNOTATION tier only, never pooled with the donor-pseudobulk claim spine and writing no effect-size row. Closes the two gaps stage 18's own tables name. Stage 18 draws random regulons matched on size, repressing-edge fraction and expression decile, fits a size-conditional residual over the real regulons, and permutes the ranked list's gene labels; none of those holds target promiscuity fixed, and all of them permute the annotation rather than the design. This stage adds one null per gap and reports both against the stage-18 ladder. The rewiring null rewires the CollecTRI TF-to-target bipartite graph by curveball trades, which preserve every regulon's size and every target's in-degree exactly, so a drawn regulon samples the jointly-owned genes as heavily as the observed regulon does and the promiscuity objection sits inside the null rather than beside it; each regulon keeps its own multiset of edge signs, permuted. The sign-flip null swaps the synovial-fluid and paired-blood labels within donor and refits limma-voom, which is the exchangeability a paired design licenses and which preserves the gene-gene correlation that gene-label permutation destroys; with six donors carrying both arms in Treg all 2^6 = 64 configurations are enumerated, so the test is exact and no seed enters it, at the cost of a resolution floor of one-sided p = 0.0156 that is published with the result. Two hard gates run first and neither is a finding: the fast closed-form ULM used for the draws must reproduce decoupleR's run_ulm on the observed network, and the identity configuration of the sign-flip must reproduce the committed ranked list. Neither null can license a statement about HIF1A the protein: both are statements about the CollecTRI HIF1A regulon's ULM activity on this contrast."

# =============================================================================
# INFERRED TF ACTIVITY FORENSICS (stage 18_tf_activity)
# =============================================================================
# The network is the same file the unbiased sweep reads as an UNSIGNED gene-set
# collection (`unbiased_enrichment.tf_network`). Here it is used SIGNED, with the
# recorded per-edge mode of regulation, which is what makes the direction audit and
# the multivariate collinearity test possible. Run parameters that already exist in
# `thresholds:` are NOT restated: minsize comes from gsea_min_size and the seed from
# gsea_seed, so this stage and the sweep share one source of truth.

tf_activity:
  # Sorted populations, primary first. Tcon and CD8 are the controls for any claim
  # that something is Treg-selective.
  populations:
    - { tag: "treg", label: "Treg" }
    - { tag: "tcon", label: "Tcon" }
    - { tag: "cd8",  label: "CD8" }

  # Network variants. `signed` is primary; the other three isolate one property each.
  #   unsigned          -- every edge forced to +1, so the score cannot use direction
  #   literature_signed -- only edges whose sign CollecTRI records as evidence-based
  #                        (sign_decision other than "default activation"), the tighter
  #                        higher-confidence regulon
  #   alias_recovered   -- signed, plus targets recovered by resolving a current HGNC
  #                        symbol to the pre-2019 symbol the JIA matrix carries
  network_variants: ["signed", "unsigned", "literature_signed", "alias_recovered"]
  mor_col: "weight"                   # CollecTRI human table names the sign column `weight`
  sign_decision_col: "sign_decision"
  default_sign_decision: "default activation"

  # Estimators. ULM is primary; MLM and consensus are the forensics that make the
  # target-collinearity test possible.
  methods: ["ulm", "mlm", "consensus"]
  consensus_statistics: ["ulm", "mlm", "wsum"]

  # The transcription factors carried through every forensic. HIF1A is the subject;
  # the rest are the headline table's neighbours plus EPAS1 as the other HIF-axis member.
  focus_tfs: ["HIF1A", "NFKB1", "STAT3", "CREB1", "ATF3", "REL", "HSF1", "EPAS1"]
  # Decomposed target by target. HIF1A is the subject and NFKB1 the comparator a reader
  # can hold it against on the same axis.
  decompose_tfs: ["HIF1A", "NFKB1"]
  primary_population: "treg"

  # A target in this many or fewer CollecTRI regulons counts as low-promiscuity for the
  # decomposition bands. `1` means the subject regulon is the only one that claims it.
  selective_max_regulons: 1
  promiscuity_bands: [1, 2, 5, 10, 25]

  # Size calibration nulls. Random regulons match the observed regulon on size and on
  # the fraction of repressing edges; the expression-matched draw additionally samples
  # within the observed regulon's average-expression deciles.
  null_draws: 1000
  null_expression_deciles: 10

  # Canonical HIF1A-selective targets, named so a reader sees their direction rather
  # than inferring it from an aggregate. Reported whether or not they match.
  canonical_hif1a_targets:
    ["PDK1", "BNIP3", "BNIP3L", "CA9", "SLC2A1", "VEGFA", "EGLN3", "ADM", "HK2", "LDHA", "PGK1"]

  # Pre-2019 symbol probes. The JIA matrix carries the left member of each pair; a
  # lookup written against the right member silently returns nothing.
  symbol_vocabulary_probes:
    - { matrix_symbol: "MB21D1",  current_symbol: "CGAS" }
    - { matrix_symbol: "TMEM173", current_symbol: "STING1" }
    - { matrix_symbol: "MARCH5",  current_symbol: "MARCHF5" }
    - { matrix_symbol: "MRE11A",  current_symbol: "MRE11" }

  # The committed unsigned-regulon fgsea rows this stage calibrates. Read within the
  # compartment, so no hash pin is required.
  fgsea_sweep_table: "03_results/14_unbiased_enrichment/tables/gsea_all.csv"
  fgsea_database: "TF_Targets"

  # The one axis every rank-cascade panel uses, here and in the mouse anchor. The plotted
  # quantity is rank as a percentage of the factors scored in that same configuration,
  # because the denominators differ — 388 to 603 across the configurations here, 263 to 658
  # in the anchor — so a raw rank read across two columns compares two different things.
  # log10 keeps the top of the ranking legible, where every focus factor sits; the range is
  # pinned, over fitted, so no panel can rescale itself and read as a different result.
  rank_axis:
    percent_limits: [0.1, 100]
    percent_breaks: [0.1, 0.3, 1, 3, 10, 30, 100]

# =============================================================================
# TWO STRONGER NULLS FOR AN INFERRED REGULON ACTIVITY (stage 19_regulon_nulls)
# =============================================================================
# Stage 18 leaves a gap that stage 18's own tables name. Its three nulls are: random
# regulons matched on size, repressing-edge fraction and expression decile; a
# size-conditional residual taken over the real regulons; and a permutation of the ranked
# list's gene LABELS. None of them holds target PROMISCUITY fixed, which is the property
# `target_decomposition.csv` shows carries the score, and all three permute the ANNOTATION
# and leave the experimental design fixed. This stage adds one null for each gap.
#
#   rewiring  -- the CollecTRI TF->target bipartite graph is rewired by curveball trades,
#                which preserve every regulon's size AND every target's in-degree exactly.
#                A drawn regulon therefore samples the promiscuous genes as heavily as the
#                observed one does, so "the score comes from jointly-owned genes" is inside
#                the null, in place of sitting beside it as a caveat. Each regulon keeps its own
#                multiset of edge signs, permuted, matching tf_activity's null convention.
#   sign-flip -- the SF/PB labels are swapped WITHIN donor, which is the exchangeability the
#                paired design actually licenses, and the contrast is refitted. Gene-label
#                permutation destroys gene-gene correlation and is anti-conservative; this
#                preserves it. It is also EXACT, over sampled: the six donors carrying
#                both arms in Treg give 2^6 = 64 configurations and all of them are
#                enumerated, so no seed enters the p-value. The cost is resolution — the
#                finest attainable one-sided p is 1/64 = 0.0156, and that floor is published
#                with the result, so a reader reads it off the table.
#
# Everything not listed here is read from the blocks above: the population, focus factors,
# network path, mor and sign columns, minsize and seed. Two parameters exist that the stage
# would rather assert than trust, and both are hard gates: the fast closed-form ULM must
# reproduce decoupleR to `ulm_validation_min_spearman`, and the identity configuration of the
# sign-flip must reproduce the committed ranked list to `signflip_identity_min_spearman`.

regulon_nulls:
  rewiring_draws: 1000
  # Curveball mixing. Burn-in is a multiple of the EDGE count (Strona et al. 2014 mix in
  # O(number of ones) trades); between draws the chain advances by a multiple of the ROW
  # count, which decorrelates consecutive draws without re-burning the whole chain.
  rewiring_burn_in_trades_per_edge: 5
  rewiring_trades_between_draws_per_tf: 2

  # A guard: exact enumeration is 2^n_paired_donors, so a compartment with more paired donors
  # than this must switch to sampling deliberately, and the guard stops it before it hangs.
  signflip_max_exact_donors: 20

  # Hard gates. Neither is a result; both stop the run.
  ulm_validation_min_spearman: 0.9999
  signflip_identity_min_spearman: 0.99

